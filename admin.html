<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel — Inclusão no Cotidiano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css?v=35" />
    <link rel="stylesheet" href="css/conta.css?v=2" />
  </head>
  <body data-pagina="admin">
    <header class="cabecalho">
      <a class="logo" href="index.html">
        <img src="img/logo-inclusao.png?v=2" alt="Inclusão no Cotidiano" />
      </a>
      <nav class="menu" aria-label="Seções">
        <a href="index.html"><img src="img/icones/simbolo.png?v=1" alt="" />Início</a>
        <a href="index.html#atividades"><img src="img/icones/atividades.png?v=1" alt="" />Atividades</a>
        <a href="index.html#jogos"><img src="img/icones/jogos.png?v=1" alt="" />Jogos</a>
        <a href="index.html#gratuitos"><img src="img/icones/gratuitos.png?v=1" alt="" />Gratuitos</a>
        <a href="index.html#dicas"><img src="img/icones/dicas.png?v=1" alt="" />Dicas</a>
        <a href="index.html#historia"><img src="img/icones/inclusao.png?v=1" alt="" />Sobre mim</a>
        <a data-conta href="minhas.html">Minha conta</a>
        <a class="so-admin visivel" href="admin.html">Painel</a>
      </nav>
    </header>

    <main class="conta">
      <div class="conta-topo">
        <h1>Painel da loja</h1>
        <button class="botao botao-secundario" id="sair" type="button" hidden>Sair</button>
      </div>
      <p id="admin-bloqueio" hidden></p>
      <p class="aviso-conta" id="admin-status" role="status"></p>
      <div id="admin-corpo" hidden>
        <section class="admin-bloco" aria-labelledby="titulo-lucros">
          <h2 id="titulo-lucros">Lucros</h2>
          <p>Entra aqui o valor dos Pix que você já confirmou.</p>
          <div class="filtros" role="group" aria-label="Período">
            <button class="filtro" type="button" data-periodo="dia" aria-pressed="true">Dia</button>
            <button class="filtro" type="button" data-periodo="mes" aria-pressed="false">Mês</button>
            <button class="filtro" type="button" data-periodo="ano" aria-pressed="false">Ano</button>
          </div>
          <p class="lucro-total" id="lucro-total"></p>
          <div class="lista-conta" id="lista-lucros"></div>
        </section>
        <section class="admin-bloco" aria-labelledby="titulo-atividades-admin">
          <h2 id="titulo-atividades-admin">Atividades no site</h2>
          <div class="lista-conta" id="lista-atividades"></div>
        </section>
        <section class="admin-bloco" aria-labelledby="titulo-nova">
          <h2 id="titulo-nova">Nova atividade</h2>
          <p>O card da loja e a página exclusiva nascem juntos, no mesmo formato da atividade de adição.</p>
          <form id="nova-atividade">
            <label>
              Qual é a atividade
              <input name="titulo" type="text" required />
            </label>
            <label>
              Descrição breve
              <textarea name="resumo" rows="3" required></textarea>
            </label>
            <label>
              O que a pessoa pode esperar
              <textarea name="explicacao" rows="8" required></textarea>
            </label>
            <label>
              Habilidades, uma por linha
              <textarea name="habilidades" rows="5"></textarea>
            </label>
            <label>
              O que inclui, um item por linha
              <textarea name="inclui" rows="3"></textarea>
            </label>
            <label>
              Valor
              <input name="preco" type="number" min="1" step="0.01" value="10" required />
            </label>
            <label>
              PDF, se já estiver pronto
              <input name="pdf" type="file" accept="application/pdf" />
            </label>
            <button class="botao" type="submit">Criar atividade</button>
            <p class="aviso-conta" id="nova-status" role="status"></p>
          </form>
        </section>
        <div class="admin-grade">
          <section class="admin-bloco" aria-labelledby="titulo-contas">
            <h2 id="titulo-contas">Contas</h2>
            <div class="lista-conta" id="lista-contas"></div>
          </section>
          <section class="admin-bloco" aria-labelledby="titulo-pedidos">
            <h2 id="titulo-pedidos">Pedidos</h2>
            <div class="lista-conta" id="lista-admin"></div>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="js/sessao.js?v=7"></script>
    <script type="module" src="js/conta.js?v=8"></script>
  </body>
</html>
